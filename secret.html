<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusheen</title>
    <link rel="icon" type="image/png" href="fon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');

        :root {
            --pusheen-pink: #fce4ec;
            --pusheen-brown: #604941;
            --pusheen-accent: #ffb7b2;
            --pusheen-yellow: #ffe5b4;
        }

        body {
            font-family: 'Comfortaa', cursive;
            background-color: #fff9f6;
            background-image: url("fon.png");
            background-repeat: repeat;
            background-size: 140px auto;
            animation: moveBackground 30s linear infinite; 
            color: var(--pusheen-brown);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            touch-action: none;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: 360px 360px; }
        }

        .banner {
            width: 100%;
            background-color: rgba(252, 228, 236, 0.95);
            padding: 12px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(96, 73, 65, 0.15);
            border-bottom: 4px solid var(--pusheen-accent);
            z-index: 10;
            user-select: none;
        }

        .banner h1 {
            margin: 0;
            font-size: 1.1rem;
            text-shadow: 1px 1px 0px white;
            padding: 0 10px;
        }

        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 249, 246, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            cursor: pointer;
            user-select: none;
        }

        .start-box {
            background: white;
            padding: 25px;
            border-radius: 24px;
            border: 4px solid var(--pusheen-pink);
            text-align: center;
            box-shadow: 0 10px 25px rgba(96, 73, 65, 0.15);
            max-width: 260px;
        }

        .start-box p {
            margin: 0 0 15px 0;
            font-weight: bold;
            font-size: 1rem;
        }

        .pet-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .pusheen-pet {
            position: absolute;
            width: 60px;
            height: 60px;
            object-fit: contain;
            cursor: grab;
            pointer-events: auto;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.1));
            transition: transform 0.1s ease;
        }

        .pusheen-pet:active {
            cursor: grabbing;
            transform: scale(1.15);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
            z-index: 10000;
        }

        .nav-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 15px 0;
            background: rgba(252, 228, 236, 0.85);
            border-top: 4px solid var(--pusheen-brown);
            z-index: 10;
            user-select: none;
        }

        .back-btn {
            background-color: var(--pusheen-yellow);
            color: var(--pusheen-brown);
            border: 3px solid var(--pusheen-brown);
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 var(--pusheen-brown);
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--pusheen-brown);
        }

        .back-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--pusheen-brown);
        }

        @media (min-width: 600px) {
            .banner h1 { font-size: 1.5rem; }
            .pusheen-pet { width: 80px; height: 80px; }
            .back-btn { font-size: 1.1rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <div class="start-overlay" id="start-overlay" onclick="startPets()">
        <div class="start-box">
            <p>Пушины прыгают</p>
            <div class="back-btn" style="box-shadow: none; pointer-events: none;">СТАРТ</div>
        </div>
    </div>

    <div class="banner">
        <h1>ПУШИН</h1>
    </div>

    <div class="pet-container" id="container"></div>

    <div class="nav-container">
        <a href="index.html" class="back-btn">◀ Назад</a>
    </div>

    <script>
        const container = document.getElementById('container');
        const overlay = document.getElementById('start-overlay');
        const images = ["1.png", "2.png", "3.png", "4.png", "5.png"];
        
        let audioCtx = null;
        let pets = [];
        const gravity = 0.35;
        const bounce = -0.65;
        const friction = 0.99;

        function createMeowSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            const now = audioCtx.currentTime;
            const baseFreq = 360 + Math.random() * 220; 
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * (1.2 + Math.random() * 0.4), now + 0.12);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.22);
        }

        function spawnPets() {
            const screenWidth = window.innerWidth;
            const count = screenWidth < 600 ? 15 : 30;

            for (let i = 0; i < count; i++) {
                const img = document.createElement('img');
                img.src = images[Math.floor(Math.random() * images.length)];
                img.className = 'pusheen-pet';
                
                const size = screenWidth < 600 ? 60 : 80;
                const x = Math.random() * (screenWidth - size);
                const y = window.innerHeight - size - 100;

                img.style.left = `${x}px`;
                img.style.top = `${y}px`;

                container.appendChild(img);

                const petObj = {
                    element: img,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -(10 + Math.random() * 12),
                    size: size,
                    isDragged: false,
                    lastX: x,
                    lastY: y
                };

                initDrag(petObj);
                pets.push(petObj);
            }
        }

        function initDrag(pet) {
            const el = pet.element;

            function start(e) {
                pet.isDragged = true;
                pet.vx = 0;
                pet.vy = 0;
                createMeowSound();
                move(e);
            }

            function move(e) {
                if (!pet.isDragged) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                pet.x = clientX - pet.size / 2;
                pet.y = clientY - pet.size / 2;

                pet.vx = pet.x - pet.lastX;
                pet.vy = pet.y - pet.lastY;

                pet.lastX = pet.x;
                pet.lastY = pet.y;

                el.style.left = `${pet.x}px`;
                el.style.top = `${pet.y}px`;
            }

            function end() {
                if(pet.isDragged) {
                    pet.isDragged = false;
                    createMeowSound();
                }
            }

            el.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);

            el.addEventListener('touchstart', start, {passive: true});
            window.addEventListener('touchmove', move, {passive: false});
            window.addEventListener('touchend', end);
        }

        function updatePhysics() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const bannerHeight = 55;
            const footerHeight = 80;

            pets.forEach(pet => {
                if (pet.isDragged) return;

                pet.vy += gravity;
                pet.vx *= friction;
                pet.vy *= friction;

                pet.x += pet.vx;
                pet.y += pet.vy;

                if (pet.x < 0) {
                    pet.x = 0;
                    pet.vx *= bounce;
                    createMeowSound();
                } else if (pet.x > screenWidth - pet.size) {
                    pet.x = screenWidth - pet.size;
                    pet.vx *= bounce;
                    createMeowSound();
                }

                if (pet.y < bannerHeight) {
                    pet.y = bannerHeight;
                    pet.vy *= bounce;
                } else if (pet.y > screenHeight - footerHeight - pet.size) {
                    pet.y = screenHeight - footerHeight - pet.size;
                    
                    if (Math.random() > 0.15) {
                        pet.vy = -(8 + Math.random() * 10);
                        pet.vx += (Math.random() - 0.5) * 4;
                    } else {
                        pet.vy *= bounce;
                    }
                    
                    if (Math.abs(pet.vy) > 2) {
                        createMeowSound();
                    }
                }

                pet.element.style.left = `${pet.x}px`;
                pet.element.style.top = `${pet.y}px`;
            });

            requestAnimationFrame(updatePhysics);
        }

        function startPets() {
            overlay.style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            spawnPets();
            requestAnimationFrame(updatePhysics);
        }

        window.addEventListener('resize', () => {
            if (!overlay.style.display || overlay.style.display === 'none') {
                container.innerHTML = '';
                pets = [];
                spawnPets();
            }
        });
    </script>
</body>
</html>
