<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusheen</title>
    <link rel="icon" type="image/png" href="fon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap');

        :root {
            --pusheen-pink: #fce4ec;
            --pusheen-brown: #604941;
            --pusheen-mint: #e8f5e9;
            --pusheen-accent: #ffb7b2;
            --pusheen-yellow: #ffe5b4;
        }

        body {
            font-family: 'Comfortaa', cursive;
            background-color: #fff9f6;
            background-image: url("fon.png");
            background-repeat: repeat;
            background-size: 180px auto;
            animation: moveBackground 30s linear infinite; 
            color: var(--pusheen-brown);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            box-sizing: border-box;
        }

        @keyframes moveBackground {
            from { background-position: 0 0; }
            to { background-position: 360px 360px; }
        }

        .banner {
            width: 100%;
            background-color: rgba(252, 228, 236, 0.95);
            padding: 12px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(96, 73, 65, 0.15);
            border-bottom: 4px solid var(--pusheen-accent);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .banner h1 {
            margin: 0;
            font-size: 1.2rem;
            text-shadow: 1px 1px 0px white;
            padding: 0 10px;
        }

        .secret-btn {
            background-color: var(--pusheen-yellow);
            color: var(--pusheen-brown);
            border: 3px solid var(--pusheen-brown);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Comfortaa', cursive;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 0 var(--pusheen-brown);
            text-decoration: none;
            display: inline-block;
        }

        .secret-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--pusheen-brown);
        }

        .secret-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--pusheen-brown);
        }

        .slider-container {
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(96, 73, 65, 0.15);
            border: 4px solid var(--pusheen-pink);
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 5;
        }

        .photo-window {
            width: 100%;
            height: 280px;
            border-radius: 18px;
            overflow: hidden;
            background-color: var(--pusheen-mint);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px dashed var(--pusheen-accent);
            box-sizing: border-box;
        }

        .photo-window img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .nav-btn {
            background-color: white;
            border: 3px solid var(--pusheen-brown);
            color: var(--pusheen-brown);
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 var(--pusheen-brown);
            position: relative;
        }

        .nav-btn:hover {
            background-color: var(--pusheen-pink);
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 var(--pusheen-brown);
        }

        .counter {
            font-size: 1rem;
            font-weight: bold;
            background: var(--pusheen-pink);
            padding: 5px 15px;
            border-radius: 12px;
            border: 2px solid var(--pusheen-brown);
        }

        .cookie-particle {
            position: absolute;
            font-size: 20px;
            pointer-events: none;
            animation: explode 0.6s ease-out forwards;
            z-index: 100;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            background: rgba(252, 228, 236, 0.9);
            border-top: 4px solid var(--pusheen-brown);
            border-bottom: 4px solid var(--pusheen-brown);
            padding: 10px 0;
            margin-top: auto;
            margin-bottom: 15px;
            display: flex;
            z-index: 5;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            animation: scrollMarquee 15s linear infinite;
        }

        .marquee-item {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 15px;
            border: 3px solid var(--pusheen-brown);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 8px;
            box-shadow: 0 3px 0 rgba(0,0,0,0.05);
            overflow: hidden;
            flex-shrink: 0;
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes scrollMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-33.333%); }
        }

        @media (min-width: 600px) {
            .banner {
                flex-direction: row;
                padding: 15px 0;
                gap: 20px;
            }
            .banner h1 { font-size: 1.5rem; }
            .secret-btn { font-size: 1rem; padding: 8px 18px; }
            .slider-container { max-width: 450px; padding: 25px; margin-top: 40px; }
            .photo-window { height: 350px; }
            .nav-btn { width: 55px; height: 55px; font-size: 1.5rem; }
            .counter { font-size: 1.2rem; }
            .marquee-container { padding: 15px 0; margin-bottom: 20px; }
            .marquee-item { width: 90px; height: 90px; margin: 0 15px; }
        }
    </style>
</head>
<body>

    <audio id="meow-sound" src="meow.mp3" preload="auto"></audio>

    <div class="banner">
        <h1>Пушин</h1>
        <a href="secret.html" class="secret-btn" onclick="goToSecretPage(event)">Секретное место ✨</a>
    </div>

    <div class="slider-container">
        <div class="photo-window">
            <img id="slider-img" src="1.png" alt="Пушин фото">
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="prevSlide(event)">◀</button>
            <div class="counter" id="counter">1 / 5</div>
            <button class="nav-btn" onclick="nextSlide(event)">▶</button>
        </div>
    </div>

    <div class="marquee-container">
        <div class="marquee-track">
            <div class="marquee-item"><img src="1.png" alt="Пушин 1"></div>
            <div class="marquee-item"><img src="2.png" alt="Пушин 2"></div>
            <div class="marquee-item"><img src="3.png" alt="Пушин 3"></div>
            <div class="marquee-item"><img src="4.png" alt="Пушин 4"></div>
            <div class="marquee-item"><img src="5.png" alt="Пушин 5"></div>
            
            <div class="marquee-item"><img src="1.png" alt="Пушин 1"></div>
            <div class="marquee-item"><img src="2.png" alt="Пушин 2"></div>
            <div class="marquee-item"><img src="3.png" alt="Пушин 3"></div>
            <div class="marquee-item"><img src="4.png" alt="Пушин 4"></div>
            <div class="marquee-item"><img src="5.png" alt="Пушин 5"></div>

            <div class="marquee-item"><img src="1.png" alt="Пушин 1"></div>
            <div class="marquee-item"><img src="2.png" alt="Пушин 2"></div>
            <div class="marquee-item"><img src="3.png" alt="Пушин 3"></div>
            <div class="marquee-item"><img src="4.png" alt="Пушин 4"></div>
            <div class="marquee-item"><img src="5.png" alt="Пушин 5"></div>
        </div>
    </div>

    <script>
        const images = ["1.png", "2.png", "3.png", "4.png", "5.png"];
        let currentIndex = 0;

        const sliderImg = document.getElementById('slider-img');
        const counter = document.getElementById('counter');
        const meowSound = document.getElementById('meow-sound');

        function playMeow() {
            meowSound.currentTime = 0;
            meowSound.play().catch(err => console.log("Звук отключен"));
        }

        function spawnCookies(event) {
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            
            for (let i = 0; i < 6; i++) {
                const cookie = document.createElement('div');
                cookie.className = 'cookie-particle';
                cookie.innerText = i % 2 === 0 ? '🍪' : '🍩';
                
                cookie.style.left = `${rect.left + rect.width / 2 - 10 + window.scrollX}px`;
                cookie.style.top = `${rect.top + rect.height / 2 - 10 + window.scrollY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 50;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                cookie.style.setProperty('--x', `${x}px`);
                cookie.style.setProperty('--y', `${y}px`);

                document.body.appendChild(cookie);
                setTimeout(() => cookie.remove(), 600);
            }
        }

        function updateSlider() {
            sliderImg.style.opacity = 0;
            sliderImg.style.transform = "scale(0.95)";

            setTimeout(() => {
                sliderImg.src = images[currentIndex];
                counter.innerText = `${currentIndex + 1} / ${images.length}`;
                sliderImg.style.opacity = 1;
                sliderImg.style.transform = "scale(1)";
            }, 150);
        }

        function nextSlide(event) {
            playMeow();
            spawnCookies(event);
            if (currentIndex < images.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateSlider();
        }

        function prevSlide(event) {
            playMeow();
            spawnCookies(event);
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = images.length - 1;
            }
            updateSlider();
        }

        function goToSecretPage(event) {
            event.preventDefault();
            playMeow();
            spawnCookies(event);
            const targetUrl = event.currentTarget.href;
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 400);
        }
    </script>
</body>
</html>
